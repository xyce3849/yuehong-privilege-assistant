name: Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        required: true
        default: Release
        type: choice
        options:
          - Debug
          - Release

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK: "29.0.13113456"
      CMAKE_VERSION: "3.22.1"
      ANDROID_PLATFORM: "android-37.0"
      ANDROID_BUILD_TOOLS: "36.0.0"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"

    steps:
      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. JDK 21
      # ------------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # ------------------------------------------------------------
      # 3. Android SDK
      #
      # setup-android@v4 自己负责接受 SDK licenses。
      # 不再额外执行 yes | sdkmanager --licenses。
      # ------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          accept-android-sdk-licenses: true

      # ------------------------------------------------------------
      # 4. Install required Android SDK packages
      #
      # Android 37 当前平台包为 android-37.0。
      # ------------------------------------------------------------
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${CMAKE_VERSION}"

      # ------------------------------------------------------------
      # 5. Verify Android toolchain
      # ------------------------------------------------------------
      - name: Verify Android toolchain
        shell: bash
        run: |
          set -e

          echo "========== Java =========="
          java -version

          echo
          echo "========== Android SDK =========="
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          echo
          echo "========== Installed SDK packages =========="
          sdkmanager --list_installed > /tmp/installed-packages.txt
          head -100 /tmp/installed-packages.txt

          echo
          echo "========== Check SDK Platform =========="
          test -d "${ANDROID_SDK_ROOT}/platforms/${ANDROID_PLATFORM}"

          echo
          echo "========== Check Build Tools =========="
          test -d "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}"

          echo
          echo "========== Check NDK =========="
          test -d "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK}"

          echo
          echo "========== Check CMake =========="
          test -d "${ANDROID_SDK_ROOT}/cmake/${CMAKE_VERSION}"

          echo
          echo "Android toolchain verification passed."

      # ------------------------------------------------------------
      # 6. Make Gradle wrapper executable
      # ------------------------------------------------------------
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # ------------------------------------------------------------
      # 7. Select build variant
      # ------------------------------------------------------------
      - name: Select build variant
        id: variant
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "name=${{ inputs.variant }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=Release" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------------
      # 8. Restore release signing from secrets
      #
      # 公开源码不附带发行密钥或签名属性（keystore.properties 已被
      # .gitignore 忽略），Release 构建必须由构建者注入签名材料。
      # 这里把 GitHub Actions 仓库密钥还原成 keystore.properties +
      # release.keystore，供 manager/build.gradle 的 sign 签名配置读取。
      # 仅 Release 变体需要；Debug 使用 AGP 自动生成的调试证书，跳过本步。
      # 所需仓库密钥（Settings > Secrets and variables > Actions）：
      #   APPS_KEYSTORE          —— release.keystore 的 base64 编码内容（单行）
      #   APPS_KEYSTORE_PASSWORD —— 密钥库口令
      #   APPS_KEY_ALIAS         —— 密钥别名
      #   APPS_KEY_PASSWORD      —— 密钥口令
      # ------------------------------------------------------------
      - name: Restore release signing
        if: steps.variant.outputs.name == 'Release'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.APPS_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.APPS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APPS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APPS_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::Release signing secret APPS_KEYSTORE is not set. Add APPS_KEYSTORE, APPS_KEYSTORE_PASSWORD, APPS_KEY_ALIAS and APPS_KEY_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi

          # 还原密钥库到仓库根目录（.keystore 已被 .gitignore 忽略，不会提交）。
          echo "${KEYSTORE_BASE64}" | base64 -d > release.keystore

          # 生成 build.gradle 读取的 keystore.properties（同样已被忽略）。
          {
            echo "storeFile=release.keystore"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties

          echo "========== Restored signing artifacts =========="
          ls -l release.keystore keystore.properties

      # ------------------------------------------------------------
      # 9. Show Gradle modules
      # ------------------------------------------------------------
      - name: Show Gradle modules
        run: ./gradlew projects --no-daemon

      # ------------------------------------------------------------
      # 10. Build Android APK
      # ------------------------------------------------------------
      - name: Build Android APK
        shell: bash
        run: |
          ./gradlew ":manager:assemble${{ steps.variant.outputs.name }}" \
            --no-daemon \
            --stacktrace

      # ------------------------------------------------------------
      # 11. Collect APK
      # ------------------------------------------------------------
      - name: Collect APK
        shell: bash
        run: |
          set -e

          mkdir -p artifacts/apk

          find . \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            -exec cp {} artifacts/apk/ \;

          echo "========== Generated APK files =========="

          find artifacts/apk \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(find artifacts/apk \
            -type f \
            -name '*.apk' \
            -print -quit)"

      # ------------------------------------------------------------
      # 12. Upload APK
      # ------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yuehong-privilege-assistant-${{ steps.variant.outputs.name }}
          path: artifacts/apk/
          if-no-files-found: error
          retention-days: 14
